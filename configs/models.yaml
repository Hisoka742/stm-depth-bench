# Модели для экспериментов (идентификаторы OpenRouter). Перечень фиксируется перед
# запуском основного набора и приводится в главе 3 вместе с датой запуска.
# max_tokens — ограничение длины ответа; для моделей с рассуждением его нужно увеличить,
# а параметры рассуждения передаются через extra (см. документацию OpenRouter).
models:
  - id: openai/gpt-4o-mini        # пример; заменить на выбранные модели
    max_tokens: 64
  # - id: <провайдер>/<модель>
  #   max_tokens: 1024
  #   extra: {reasoning: {effort: low}}
judge:
  id: openai/gpt-4o-mini          # судья не должен входить в число оцениваемых моделей
