# Модели для экспериментов (идентификаторы OpenRouter). Предварительный перечень:
# шесть моделей разных разработчиков из одного ценового класса и одна более сильная
# модель для проверки эффекта потолка. Перечень окончательно фиксируется после
# пробного прогона на пилотном наборе и приводится в главе 3 вместе с датами запуска.
#
# max_tokens — ограничение длины ответа. Для моделей, которые рассуждают по умолчанию,
# число токенов рассуждения видно в usage после пробного прогона; при необходимости
# рассуждение ограничивается через extra (параметр reasoning OpenRouter).
# У моделей OpenAI и Anthropic последнего поколения OpenRouter не передаёт temperature,
# для них используются параметры декодирования по умолчанию (отмечается в главе 3).
models:
  - id: openai/gpt-6-luna
    max_tokens: 64
  - id: anthropic/claude-haiku-5.5
    max_tokens: 64
  - id: google/gemini-3.1-flash-lite
    max_tokens: 64
  - id: deepseek/deepseek-v4.1-flash
    max_tokens: 64
  - id: qwen/qwen3.8-flash
    max_tokens: 64
  - id: mistralai/mistral-small-2603
    max_tokens: 64
  - id: openai/gpt-6.1-terra          # сильная модель: проверка эффекта потолка
    max_tokens: 64
judge:
  id: deepseek/deepseek-v4-pro        # судья не входит в число оцениваемых моделей
